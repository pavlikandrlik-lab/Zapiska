<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>pm-tabs lego test (round-out by Lea Verou)</title>
<style>
  body { background: #222; color: #ddd; font-family: system-ui, sans-serif; max-width: 1100px; margin: 32px auto; padding: 0 16px; }
  h1, h3, p { color: #eee; }
  pre { background: #111; color: #ddc385; padding: 12px; border-radius: 8px; font-size: 12px; max-height: 200px; overflow: auto; }
  .row { margin-bottom: 8px; }
  button.dbg { padding: 6px 12px; margin-right: 8px; }

  /* ============================================================
   * pm-tabs lego architecture (CSS-tricks "Tabs With Round Out Borders" by Lea Verou)
   * 4 custom elements:
   *   pm-tab          — middle/default (no edge round-outs unless active)
   *   pm-tab-left     — first from left (always LEFT edge round-out)
   *   pm-tab-right    — first from right (always RIGHT edge round-out)
   *   pm-tab-last-in-row — alias k pm-tab-right (wrapped rows)
   * Sdílejí styling, liší se jen pseudo-elementy podle pozice.
   * ============================================================ */

  pm-tabs { display: block; }

  pm-tab-list {
    display: block;
    padding: 0;
    margin: 0;
    overflow: hidden;  /* contain floated children + clip pseudos co utíkají vlevo přes okraj panelu */
  }

  /* Společné styling base — všechny varianty se chovají stejně */
  pm-tab, pm-tab-left, pm-tab-right, pm-tab-last-in-row {
    float: left;
    position: relative;
    display: block;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  pm-tab > span[data-pm-tab-inner],
  pm-tab-left > span[data-pm-tab-inner],
  pm-tab-right > span[data-pm-tab-inner],
  pm-tab-last-in-row > span[data-pm-tab-inner] {
    float: left;
    display: block;
    padding: 10px 40px;
    color: black;
    background: #ddc385;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
  }

  pm-tab[active], pm-tab-left[active], pm-tab-right[active], pm-tab-last-in-row[active] {
    z-index: 3;
  }

  pm-tab[active] > span[data-pm-tab-inner],
  pm-tab-left[active] > span[data-pm-tab-inner],
  pm-tab-right[active] > span[data-pm-tab-inner],
  pm-tab-last-in-row[active] > span[data-pm-tab-inner] {
    background: white;
    color: black;
    text-decoration: underline;
    text-decoration-color: #005ea5;
    text-decoration-thickness: 3px;
    text-underline-offset: 4px;
  }

  pm-tab[disabled] > span[data-pm-tab-inner],
  pm-tab-left[disabled] > span[data-pm-tab-inner],
  pm-tab-right[disabled] > span[data-pm-tab-inner],
  pm-tab-last-in-row[disabled] > span[data-pm-tab-inner] {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ============================================================
   * Pseudo-elementy
   * ─────────────────────────────────────────────────────────────
   * SQUARES (10x10) na pm-tab[variant] — extending tab horizontally
   * CIRCLES (20x20 round) na > span — sit OVER squares
   * ============================================================ */

  /* === Default state SQUARES — only pm-tab-left :before, pm-tab-right :after === */
  pm-tab-left::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: -10px;
    width: 10px;
    height: 10px;
    background: #ddc385;
    z-index: 1;
  }
  pm-tab-right::after,
  pm-tab-last-in-row::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -10px;
    width: 10px;
    height: 10px;
    background: #ddc385;
    z-index: 1;
  }

  /* === Default state CIRCLES — only pm-tab-left :before, pm-tab-right :after === */
  pm-tab-left > span[data-pm-tab-inner]::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: -20px;
    width: 20px;
    height: 20px;
    border-radius: 10px;
    background: #222;
    z-index: 2;
  }
  pm-tab-right > span[data-pm-tab-inner]::after,
  pm-tab-last-in-row > span[data-pm-tab-inner]::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -20px;
    width: 20px;
    height: 20px;
    border-radius: 10px;
    background: #222;
    z-index: 2;
  }

  /* === ACTIVE state SQUARES — all variants get both :before AND :after, white === */
  pm-tab[active]::before,
  pm-tab-left[active]::before,
  pm-tab-right[active]::before,
  pm-tab-last-in-row[active]::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: -10px;
    width: 10px;
    height: 10px;
    background: white;
    z-index: 1;
  }
  pm-tab[active]::after,
  pm-tab-left[active]::after,
  pm-tab-right[active]::after,
  pm-tab-last-in-row[active]::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -10px;
    width: 10px;
    height: 10px;
    background: white;
    z-index: 1;
  }

  /* === ACTIVE state CIRCLES — middle = #ddc385, edges differ === */
  pm-tab[active] > span[data-pm-tab-inner]::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: -20px;
    width: 20px; height: 20px;
    border-radius: 10px;
    background: #ddc385;
    z-index: 2;
  }
  pm-tab[active] > span[data-pm-tab-inner]::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -20px;
    width: 20px; height: 20px;
    border-radius: 10px;
    background: #ddc385;
    z-index: 2;
  }

  /* pm-tab-left active: left circle = page-bg (no neighbor), right circle = tab color (neighbor) */
  pm-tab-left[active] > span[data-pm-tab-inner]::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: -20px;
    width: 20px; height: 20px;
    border-radius: 10px;
    background: #222;
    z-index: 2;
  }
  pm-tab-left[active] > span[data-pm-tab-inner]::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -20px;
    width: 20px; height: 20px;
    border-radius: 10px;
    background: #ddc385;
    z-index: 2;
  }

  /* pm-tab-right active: left circle = tab color (left neighbor), right circle = page-bg (no neighbor) */
  pm-tab-right[active] > span[data-pm-tab-inner]::before,
  pm-tab-last-in-row[active] > span[data-pm-tab-inner]::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: -20px;
    width: 20px; height: 20px;
    border-radius: 10px;
    background: #ddc385;
    z-index: 2;
  }
  pm-tab-right[active] > span[data-pm-tab-inner]::after,
  pm-tab-last-in-row[active] > span[data-pm-tab-inner]::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: -20px;
    width: 20px; height: 20px;
    border-radius: 10px;
    background: #222;
    z-index: 2;
  }

  pm-tab-panel {
    display: block;
    padding: 16px;
    background: white;
    color: black;
    clear: both;
    position: relative;
    z-index: 0;
    /* Default: panel zaoblený všechny 4 rohy */
    border-radius: 15px;
  }
  pm-tab-panel:not([active]) { display: none; }

  /* Edge case: pm-tab-left active → panel top-left = 0 (tab navazuje na panel zleva) */
  pm-tabs:has(pm-tab-left[active]) pm-tab-panel {
    border-top-left-radius: 0;
  }
  /* Edge case: pm-tab-right (resp. pm-tab-last-in-row) active → panel top-right = 0 */
  pm-tabs:has(pm-tab-right[active]) pm-tab-panel,
  pm-tabs:has(pm-tab-last-in-row[active]) pm-tab-panel {
    border-top-right-radius: 0;
  }
</style>
</head>
<body>
<h1>pm-tabs lego test</h1>
<p>4 varianty: <code>pm-tab-left</code> / <code>pm-tab</code> (middle) / <code>pm-tab-right</code> / <code>pm-tab-last-in-row</code></p>

<div class="row">
  <button class="dbg" onclick="document.querySelector('pm-tabs').setActive('two')">setActive('two')</button>
  <button class="dbg" onclick="console.log('activeKey=', document.querySelector('pm-tabs').activeKey)">log activeKey</button>
</div>

<pm-tabs persist="hash" persist-key="lego-test" initial="one">
  <pm-tab-list>
    <pm-tab-left key="one">První</pm-tab-left>
    <pm-tab key="two">Druhá</pm-tab>
    <pm-tab-right key="three">Třetí</pm-tab-right>
  </pm-tab-list>

  <pm-tab-panel key="one"><h3>Panel 1</h3><p>Lorem ipsum první panel.</p></pm-tab-panel>
  <pm-tab-panel key="two"><h3>Panel 2</h3><p>Druhý panel — má input: <input type="text" placeholder="Zkus napsat" /></p></pm-tab-panel>
  <pm-tab-panel key="three"><h3>Panel 3</h3><p>Třetí panel.</p></pm-tab-panel>
</pm-tabs>

<h3 style="margin-top:32px">Console log:</h3>
<pre id="log"></pre>

<script type="module">
  import "./js/components/pmTabs.js";
  const log = document.getElementById("log");
  function append(msg) { log.textContent += msg + "\n"; console.log(msg); }
  append("[init] customElements registered: " +
    ["pm-tabs", "pm-tab-list", "pm-tab", "pm-tab-left", "pm-tab-right", "pm-tab-last-in-row", "pm-tab-panel"]
      .map(n => n + "=" + !!customElements.get(n)).join(", "));
  document.addEventListener("pm-tab-change", (e) => append("[event] pm-tab-change → " + JSON.stringify(e.detail)));
  queueMicrotask(() => {
    const tabs = document.querySelector("pm-tabs");
    append("[microtask] tabs.activeKey=" + tabs.activeKey);
  });
</script>
</body>
</html>
